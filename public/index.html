<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
  <meta name="theme-color" content="#12100e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>NameGame — the daily naming climb</title>
  <meta name="description" content="Name things, climb the tree. A free daily word game — quick-fire answers against a resetting clock. How high can you get?">
  <meta name="apple-mobile-web-app-title" content="NameGame">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body>
  <div id="stage">
    <canvas id="scene"></canvas>

    <div id="hud" class="hidden">
      <div id="cat-pill"></div>
      <div id="hud-row">
        <div id="timer-track"><div id="timer-fill"></div></div>
        <span id="timer-num">20s</span>
        <span id="score"></span>
      </div>
      <div id="feedback"></div>
    </div>

    <form id="answer-form" autocomplete="off">
      <div id="input-bar" class="hidden">
        <input id="answer" type="text" placeholder="type your answer…" enterkeyhint="go"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button type="submit" id="btn-go">Go</button>
      </div>
    </form>

    <div id="screen-start" class="screen hidden">
      <div class="panel">
        <h1><img class="icon logo" src="assets/favicon.png" alt=""> NameGame</h1>
        <p class="tagline">Name things. Climb the tree.<br>How high can you get?</p>
        <p id="day-label" class="day"></p>
        <p class="rules">3 categories · 10 seconds per answer<br>the clock tightens as you rack up answers</p>
        <p id="streak-label-start"></p>
        <div id="animal-picker-start"></div>
        <button id="btn-begin" class="big">Begin Today's Climb</button>
      </div>
    </div>

    <div id="screen-between" class="screen hidden">
      <div class="panel">
        <h2 id="between-title"></h2>
        <p id="between-msg"></p>
        <button id="btn-climb" class="big">Keep Climbing <img class="icon" src="assets/leaf.png" alt=""></button>
      </div>
    </div>

    <div id="screen-over" class="screen hidden">
      <div class="panel">
        <h2 id="over-title"></h2>
        <div id="over-score"></div>
        <p class="branches-label">branches climbed</p>
        <div id="over-breakdown"></div>
        <p id="over-stats"></p>
        <p id="over-best"></p>
        <p id="over-note"></p>
        <p id="streak-label"></p>
        <div id="animal-picker"></div>
        <button id="btn-share" class="big">Share</button>
        <button id="btn-answers" class="big secondary">See Answers</button>
        <p id="countdown"></p>
      </div>
    </div>

    <div id="screen-answers" class="screen hidden">
      <div class="panel answers">
        <h2><img class="icon" src="assets/icons/book.png" alt=""> Today's Answers</h2>
        <div id="answers-list"></div>
        <button id="btn-answers-close" class="big secondary">Back</button>
      </div>
    </div>
  </div>

  <script src="js/fuzzy.js"></script>
  <script src="js/data.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
